# Local synthetic database only. Login is payments / payments on localhost.
services:
  db:
    image: postgres:16
    container_name: payments-db
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - payments_pg:/var/lib/postgresql/data
      - ./schema:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  payments_pg:
